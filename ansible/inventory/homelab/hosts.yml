        masters:
          hosts:
            master-01:
              ansible_host: 10.10.10.10
            master-02:
              ansible_host: 10.10.10.11
            master-03:
              ansible_host: 10.10.10.12
        workers:
          hosts:
            worker-01:
              ansible_host: 10.10.10.20
            worker-02:
              ansible_host: 10.10.10.21
    # The site's NetBird routing peer (gateway.yml). Not part of the cluster.
    gateways:
      hosts:
        hl-gw-01:
          ansible_host: 10.10.10.30
