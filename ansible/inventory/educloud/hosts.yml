---
# EduCloud VMs, created by OpenTofu (opentofu/educloud/instances.tf). Addresses: docs/network-plan.md.
all:
  children:
    gateways:
      hosts:
        ec-gw-01:
          ansible_host: 10.10.31.30
    # The Rancher server's own single-node RKE2 cluster (rancher.yml). A separate cluster from EduCloud's.
    rancher:
      hosts:
        ec-rancher-01:
          ansible_host: 10.10.31.40
    # EduCloud's cluster nodes. Ansible only prepares them (nodes.yml); Rancher installs RKE2 on them.
    # The split matches the roles they get in Rancher: masters run etcd and the control plane.
    nodes:
      children:
        masters:
          hosts:
            ec-master-01:
              ansible_host: 10.10.30.10
            ec-master-02:
              ansible_host: 10.10.30.11
            ec-master-03:
              ansible_host: 10.10.30.12
        workers:
          hosts:
            ec-worker-01:
              ansible_host: 10.10.30.20
            ec-worker-02:
              ansible_host: 10.10.30.21
