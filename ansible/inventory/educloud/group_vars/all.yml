---
# Connection settings for every EduCloud VM. The user and its key are created on first boot by cloud-init
# (opentofu/educloud/cloud-init.yaml.tftpl). A separate key from Homelab's: a key leaked at one site
# does not open the other.
# No ansible_ssh_private_key_file here: each workstation has its own EduCloud key (PC: educloud-ansible,
# laptop: educloud-laptop), so the key is chosen in that machine's ~/.ssh/config, which matches the
# IPs Ansible connects to (Host ec-* 10.10.30.* 10.10.31.*). See ansible/README.md, "SSH keys".
ansible_user: nknez

# Ubuntu 26.04 uses sudo-rs by default, and Ansible does not recognise its password prompt yet
# (Launchpad bug 2122414, checked 2026-11-02). Use the classic sudo, which is still installed next to it
# (checked on ec-gw-01, 2026-11-17).
ansible_become_exe: sudo.ws

# NIC name on every EduCloud VM (cloud image on CloudStack KVM). The common role checks the planned IP is on it.
rke2_node_interface: ens3

# DNS (roles/common, tasks/dns.yml): Cloudflare instead of the VPC router, whose upstream (the school's
# resolvers) returned stale addresses for Docker Hub and Quay (2026-11-17). Must match local.public_dns
# in opentofu/educloud/network.tf, which lets this traffic out.
common_dns_servers: [1.1.1.1, 1.0.0.1]
common_dns_over_tls: opportunistic

# NetBird, the VPN between the sites and for admin access (role netbird).
netbird_setup_key_file: "{{ playbook_dir }}/secrets/educloud/netbird-setup-key"   # on the workstation, gitignored
