---
# Sets up this workstation to manage the cluster: kubectl, plus an admin kubeconfig that points at the VIP.
#   ansible-playbook -i inventory/homelab workstation.yml -K               # the cluster must be running
#   ansible-playbook -i inventory/homelab workstation.yml --tags kubectl   # kubectl only: no cluster or sudo needed
- name: Read the admin kubeconfig from the first master
  hosts: masters[0]
  become: true
  gather_facts: false
  tags: kubeconfig
  tasks:
    - name: Read the kubeconfig   # root-only on the node because it gives full admin access
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: admin_kubeconfig
      no_log: true

- name: Set up this workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    kubectl_version: "{{ rke2_version.split('+')[0] }}"   # same Kubernetes version as the cluster
    kubectl_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    kubeconfig_encoded: "{{ hostvars[groups['masters'][0]].admin_kubeconfig.content }}"
  tasks:
    - name: Install kubectl
      ansible.builtin.get_url:
        url: "{{ kubectl_url }}"
        checksum: "sha256:{{ kubectl_url }}.sha256"   # refuse the download if it doesn't match the published hash
        dest: ~/.local/bin/kubectl
        mode: "0755"
      tags: kubectl

    - name: Create the kubeconfig folder
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: "0700"
      tags: kubeconfig

    - name: Save the kubeconfig, pointed at the VIP instead of 127.0.0.1
      ansible.builtin.copy:
        content: "{{ kubeconfig_encoded | b64decode | replace('127.0.0.1', rke2_api_vip) }}"
        dest: ~/.kube/homelab.yaml
        mode: "0600"
      no_log: true
      tags: kubeconfig

    - name: Use this kubeconfig in new terminals
      ansible.builtin.lineinfile:
        path: ~/.bashrc
        line: export KUBECONFIG=~/.kube/homelab.yaml
      tags: kubeconfig
