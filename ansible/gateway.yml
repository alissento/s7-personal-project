---
# The site's gateway VM: the NetBird routing peer that links this site to the other site and to the admin.
#   ansible-playbook -i inventory/educloud gateway.yml -K
- name: Set up the NetBird routing peer
  hosts: gateways
  become: true
  # DNS first (only where common_dns_servers is set): NetBird's install and join download from the internet.
  pre_tasks:
    - name: DNS
      ansible.builtin.import_role:
        name: common
        tasks_from: dns.yml
      tags: dns
    # Key-only login, no root login: the same file the nodes get.
    # hl-gw-01 was installed by hand, so it gets it only from here.
    # Make sure the key works first (ssh -i <key> nknez@<gateway> true): password login is switched off.
    - name: SSH hardening
      ansible.builtin.import_role:
        name: common
        tasks_from: ssh.yml
      tags: ssh
  roles:
    - netbird
