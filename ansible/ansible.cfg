# Settings shared by every site. Site-specific values (user, key, IPs) live in inventory/<site>/group_vars/.
[defaults]
# No default inventory: there are two sites, so every command names one with -i (inventory/homelab or inventory/educloud).
# A default would let a command meant for one site, e.g. upgrade.yml (all hosts, reboots), silently hit the other.
host_key_checking = True
interpreter_python = auto_silent
