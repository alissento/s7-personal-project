---
# With the CIS profile, etcd runs as this user and RKE2 refuses to start without it. Only masters run etcd.
- name: Create the etcd group
  ansible.builtin.group:
    name: etcd
    system: true
  when: rke2_type == 'server'

- name: Create the etcd user
  ansible.builtin.user:
    name: etcd
    group: etcd
    comment: etcd user
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: rke2_type == 'server'

- name: Download the RKE2 install script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /root/rke2-install.sh
    owner: root
    group: root
    mode: "0700"

# The script fetches the pinned release and verifies its SHA-256 checksum. It installs but does not start RKE2.
# "creates" makes this first-install only: changing rke2_version here does not upgrade a running cluster.
- name: Install RKE2
  ansible.builtin.command: /root/rke2-install.sh
  args:
    creates: /usr/local/bin/rke2
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ rke2_type }}"

- name: Create the RKE2 config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rancher/rke2
    - /etc/rancher/rke2/config.yaml.d

# RKE2 applies every manifest in here, so Cilium and kube-vip settings must be in place before the first start.
- name: Create the RKE2 manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: rke2_type == 'server'
