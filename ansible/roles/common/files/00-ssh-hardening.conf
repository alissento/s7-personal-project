# Managed by Ansible (roles/common). Manual changes are overwritten.
# Named 00-* because sshd keeps the FIRST value it reads for a setting, and Ubuntu's
# cloud-init drop-in (50-cloud-init.conf) may set PasswordAuthentication yes.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers nknez
MaxAuthTries 3
X11Forwarding no
