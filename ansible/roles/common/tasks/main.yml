---
# Node preparation, one file per topic. Run a single part with --tags, e.g.:
#   ansible-playbook site.yml -K --tags disk
- name: Pre-flight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: preflight

# Right after the checks: everything after it downloads something, so DNS must already work.
- name: DNS
  ansible.builtin.import_tasks: dns.yml
  tags: dns

# Extra routes (Homelab: EduCloud through the NetBird gateway). Not applied with netplan apply, see the file.
- name: Static routes
  ansible.builtin.import_tasks: routes.yml
  tags: routes

- name: SSH hardening
  ansible.builtin.import_tasks: ssh.yml
  tags: ssh

- name: Disk layout
  ansible.builtin.import_tasks: disk.yml
  tags: disk

- name: Swap off
  ansible.builtin.import_tasks: swap.yml
  tags: swap

- name: Base packages
  ansible.builtin.import_tasks: packages.yml
  tags: packages
