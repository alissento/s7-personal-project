---
# Only installs what is missing. OS upgrades and reboots live in upgrade.yml,
# so a routine site.yml run can never restart a node.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl               # used by the RKE2 install script
      - qemu-guest-agent   # lets Proxmox see the VM's IP and shut it down cleanly
    state: present
    update_cache: true
    cache_valid_time: 3600   # don't refresh the package list again if it's less than an hour old

# The unit has no enabled state: it starts on boot when the hypervisor gives the VM a guest agent channel
# (Proxmox: the VM's QEMU Guest Agent option). Without that channel the service cannot start, so it is only
# started where the channel exists; a Homelab VM without it shows up as "skipped" here.
- name: Check for the guest agent channel
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: common_guest_agent_channel

- name: Start the guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
  when: common_guest_agent_channel.stat.exists
  # In --check mode the package above is only pretended to be installed, so on a new VM the service does
  # not exist yet. Only then is the error ignored; a real run always fails loudly.
  ignore_errors: "{{ ansible_check_mode }}"
