---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

# Re-reads /etc/netplan/ and reconfigures the NIC. DHCP keeps the same address, so SSH stays up.
- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Restart systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
